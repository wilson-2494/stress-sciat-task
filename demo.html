<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SC-IAT</title>
  <!-- Load MinnoJS directly from primary CDN -->
  <script src="https://cdn.jsdelivr.net/gh/minnojs/minno-quest@0.3/dist/pip.js"></script>
</head>
<body style="margin:0; padding:0; background:#ffffff;">
  <div id="minno-runner"></div>

  <script>
    // Run task directly using Minno's core PIP engine
    window.onload = function() {
      if (window.pip) {
        pip({
          url: 'https://cdn.jsdelivr.net/gh/baranan/minno-tasks@0.4/SCIAT/sciat6.js',
          onEnd: function(data) {
            window.parent.postMessage({ type: 'MINNO_DEMO_COMPLETE', data: data }, '*');
          }
        });
      } else {
        document.body.innerHTML = '<h3 style="text-align:center; padding-top:40px; font-family:sans-serif;">Loading error. Please refresh.</h3>';
      }
    };
  </script>
</body>
</html>
