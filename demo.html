<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MinnoJS Demo</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>
</head>
<body style="margin:0; padding:0;">
  <div id="minno-runner"></div>
  <script>
    require(['https://cdn.jsdelivr.net/gh/baranan/minno-tasks@0.4/SCIAT/qualtrics/qsciat6.js'], function(minnoJS) {
      minnoJS({
        scriptURL: 'https://cdn.jsdelivr.net/gh/baranan/minno-tasks@0.4/SCIAT/qualtrics/example.js',
        onFinish: function(data) {
          window.parent.postMessage({ type: 'MINNO_DEMO_COMPLETE' }, '*');
        }
      });
    });
  </script>
</body>
</html>
