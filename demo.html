<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MinnoJS SC-IAT Test</title>
  <!-- Load jQuery and standard Minno PIP engine directly -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/minnojs/minno-quest@0.3/dist/pip.js"></script>
</head>
<body style="margin:0; padding:0; background-color: #ffffff;">
  <div id="minno-runner" style="min-height: 100vh; width: 100vw;"></div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (window.pip) {
        window.pip({
          url: 'https://cdn.jsdelivr.net/gh/baranan/minno-tasks@0.4/SCIAT/sciat6.js',
          onEnd: function(data) {
            window.parent.postMessage({ type: 'MINNO_DEMO_COMPLETE' }, '*');
          }
        });
      } else {
        document.body.innerHTML = '<h2 style="text-align:center; padding-top:50px; font-family:sans-serif;">Engine script failed to load.</h2>';
      }
    });
  </script>
</body>
</html>
